<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jade Financial Literacy — Sign In</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#0d1b2e;--navy2:#132338;--gold:#c9a84c;--gold2:#e2be6e;--teal:#0e9e8e;--text:#e8edf4;--muted:#8faabe;--card:#162035;--border:#1e3050;--red:#dc2626;--green:#16a34a;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#0a1520,#0d1b2e,#0a1a10);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text);}
.box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:48px 52px;width:90%;max-width:440px;box-shadow:0 24px 60px rgba(0,0,0,.5);text-align:center;}
.logo{font-size:48px;margin-bottom:12px;}
h1{font-size:26px;font-weight:700;color:var(--gold);margin-bottom:4px;}
.sub{color:var(--muted);font-size:13px;margin-bottom:32px;}
.tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:28px;}
.tab{flex:1;padding:10px;background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;transition:all .2s;}
.tab.active{background:var(--gold);color:#0d1b2e;font-weight:700;}
.form-group{margin-bottom:16px;text-align:left;}
label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.5px;}
input,select{width:100%;padding:12px 14px;border-radius:8px;border:1px solid var(--border);background:var(--navy2);color:var(--text);font-size:14px;transition:border-color .2s;}
input:focus,select:focus{outline:none;border-color:var(--gold);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.role-row{display:flex;gap:10px;margin-bottom:16px;}
.role-btn{flex:1;padding:14px 8px;border:2px solid var(--border);border-radius:10px;cursor:pointer;background:var(--navy2);transition:all .2s;text-align:center;}
.role-btn:hover,.role-btn.sel{border-color:var(--gold);background:rgba(201,168,76,.1);}
.role-btn .icon{font-size:24px;margin-bottom:4px;}
.role-btn .lbl{font-size:12px;font-weight:600;}
.btn{width:100%;padding:14px;border-radius:8px;border:none;background:var(--gold);color:#0d1b2e;font-weight:700;font-size:15px;cursor:pointer;margin-top:8px;transition:background .2s;}
.btn:hover{background:var(--gold2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.msg{margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px;display:none;}
.msg.err{background:rgba(220,38,38,.15);border:1px solid var(--red);color:#fca5a5;display:block;}
.msg.ok{background:rgba(22,163,74,.15);border:1px solid var(--green);color:#86efac;display:block;}
.divider{margin:20px 0;text-align:center;color:var(--muted);font-size:12px;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:40%;height:1px;background:var(--border);}
.divider::before{left:0;} .divider::after{right:0;}
.demo-btn{width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:13px;cursor:pointer;transition:all .2s;}
.demo-btn:hover{border-color:var(--teal);color:var(--teal);}
.spinner{display:none;width:18px;height:18px;border:2px solid #0d1b2e;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="logo">🪙</div>
  <h1>懷玉教育</h1>
  <p class="sub">Jade Financial Literacy Programme</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">Sign In</button>
    <button class="tab" onclick="switchTab('register')">Register</button>
  </div>

  <!-- LOGIN FORM -->
  <div id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="loginPwd" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn" id="loginBtn" onclick="doLogin()">
      <span id="loginTxt">Sign In</span>
      <div class="spinner" id="loginSpin"></div>
    </button>
    <div id="loginMsg" class="msg"></div>

    <div class="divider">or</div>
    <button class="demo-btn" onclick="doDemo()">🎭 &nbsp;Try Demo Mode</button>
  </div>

  <!-- REGISTER FORM -->
  <div id="registerForm" style="display:none">
    <p style="font-size:12px;color:var(--muted);margin-bottom:16px;text-align:left;">I am a…</p>
    <div class="role-row">
      <div class="role-btn sel" id="roleStudent" onclick="selectRole('student')">
        <div class="icon">🎓</div>
        <div class="lbl">Student</div>
      </div>
      <div class="role-btn" id="roleTeacher" onclick="selectRole('teacher')">
        <div class="icon">👩‍🏫</div>
        <div class="lbl">Teacher</div>
      </div>
      <div class="role-btn" id="roleSchool" onclick="selectRole('school')">
        <div class="icon">🏫</div>
        <div class="lbl">School</div>
      </div>
    </div>
    <div class="row2">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="regFirst" placeholder="First" autocomplete="given-name">
      </div>
      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="regLast" placeholder="Last" autocomplete="family-name">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" placeholder="your@email.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="regPwd" placeholder="Min 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group" id="schoolCodeGroup" style="display:none">
      <label>School Access Code <span style="color:var(--muted)">(from your school)</span></label>
      <input type="text" id="schoolCode" placeholder="e.g. HKIS2025">
    </div>
    <button class="btn" id="regBtn" onclick="doRegister()">
      <span id="regTxt">Create Account</span>
      <div class="spinner" id="regSpin"></div>
    </button>
    <div id="regMsg" class="msg"></div>
  </div>
</div>

<script>
// ── Supabase init ──────────────────────────────────────────────────────────
const SUPABASE_URL = window.SUPABASE_URL || 'https://rqdonorvtbjtarvbslbf.supabase.co';
const SUPABASE_ANON = window.SUPABASE_ANON || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJxZG9ub3J2dGJqdGFydmJzbGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NDU5MDYsImV4cCI6MjEwNDMyMTkwNn0.NlU7z8MxyHexZ5WDImpGBqUqbl_2iUp0Z5hs4rWEBiU';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

let selectedRole = 'student';

// Check if already logged in
sb.auth.getSession().then(({data:{session}}) => {
  if (session) window.location.href = '/app.html';
});

function switchTab(t) {
  document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', (i===0) === (t==='login')));
  document.getElementById('loginForm').style.display = t==='login' ? '' : 'none';
  document.getElementById('registerForm').style.display = t==='register' ? '' : 'none';
}

function selectRole(r) {
  selectedRole = r;
  ['student','teacher','school'].forEach(x => document.getElementById('role'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('sel', x===r));
  document.getElementById('schoolCodeGroup').style.display = r==='student' ? '' : 'none';
}

function setLoading(form, on) {
  const btn = document.getElementById(form+'Btn');
  const txt = document.getElementById(form+'Txt');
  const spin = document.getElementById(form+'Spin');
  btn.disabled = on;
  txt.style.display = on ? 'none' : '';
  spin.style.display = on ? 'block' : 'none';
}

function showMsg(id, text, isErr) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + (isErr ? 'err' : 'ok');
}

async function doLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pwd   = document.getElementById('loginPwd').value;
  if (!email || !pwd) { showMsg('loginMsg','Please fill in all fields.',true); return; }
  setLoading('login', true);
  const {error} = await sb.auth.signInWithPassword({email, password:pwd});
  setLoading('login', false);
  if (error) { showMsg('loginMsg', error.message, true); return; }
  window.location.href = '/app.html';
}

async function doRegister() {
  const first = document.getElementById('regFirst').value.trim();
  const last  = document.getElementById('regLast').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pwd   = document.getElementById('regPwd').value;
  const code  = document.getElementById('schoolCode').value.trim().toUpperCase();

  if (!first||!last||!email||!pwd) { showMsg('regMsg','Please fill in all fields.',true); return; }
  if (pwd.length < 8) { showMsg('regMsg','Password must be at least 8 characters.',true); return; }

  setLoading('reg', true);

  // Determine access level
  let accessLevel = 'free'; // free = week 1 only
  if (selectedRole === 'school') accessLevel = 'full';
  if (selectedRole === 'teacher') accessLevel = 'full';
  if (selectedRole === 'student' && code) {
    // validate school code via function
    const res = await fetch('/.netlify/functions/validate-code', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code})
    });
    const data = await res.json();
    if (data.valid) accessLevel = 'full';
  }

  const {data, error} = await sb.auth.signUp({
    email, password: pwd,
    options: { data: { first_name: first, last_name: last, role: selectedRole, access_level: accessLevel } }
  });

  setLoading('reg', false);

  if (error) { showMsg('regMsg', error.message, true); return; }

  // Insert profile row
  if (data.user) {
    await sb.from('profiles').insert({
      id: data.user.id,
      first_name: first,
      last_name: last,
      role: selectedRole,
      access_level: accessLevel,
      xp: 0,
      completed_weeks: [],
      quiz_passes: 0
    });
  }

  showMsg('regMsg', '✅ Account created! Check your email to verify, then sign in.', false);
}

function doDemo() {
  sessionStorage.setItem('jade_demo', '1');
  window.location.href = '/app.html';
}

// Enter key support
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('registerForm').style.display === 'none') doLogin();
  else doRegister();
});
</script>
</body>
</html>
